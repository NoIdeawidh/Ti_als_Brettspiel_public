<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TI – Prototype</title>
  <style>
    body {
      margin: 0;
      display: flex;
      background: #0e1117;
      color: #e6edf3;
      font-family: system-ui;
    }
    #ui {
      width: 300px;
      padding: 12px;
      background: #161b22;
      border-right: 1px solid #30363d;
    }
    select, button {
      width: 100%;
      margin-bottom: 6px;
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 4px;
    }
    button:hover {
      background: #30363d;
    }
    #mapSVG {
      flex: 1;
      background: #0e1117;
    }
    pre {
      font-size: 11px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div id="ui">
  <h3>Controls</h3>
  <select id="activePlayer"></select>
  <select id="moveFrom"></select>
  <select id="moveTo"></select>
  <button id="btnDoMove">Move</button>
  <button id="btnRefresh">Refresh</button>
  <hr>
  <div>Round: <span id="roundNum">0</span></div>
  <pre id="history"></pre>
</div>

<svg id="mapSVG" width="900" height="600"></svg>

<script src="/static/app.js"></script>
</body>
</html>
